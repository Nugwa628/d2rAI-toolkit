name: Bug report
description: Something in the toolkit, a skill, the knowledge base, or a mod built with it doesn't work.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't attach game files, saves or screenshots of the game**, and remove your user name from paths and logs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - modkit (build / validate / install / ops)
        - Skills or CLAUDE.md (the agent did the wrong thing)
        - Knowledge base (a fact is wrong or missing)
        - Plugin template
        - Testing tools
        - Release tools
        - Downloader
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "modkit build fails on a skill op that clones Whirlwind: ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, the patch op (JSON), or the prompt you gave the agent.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Output and logs
      description: modkit output, out/validation.md, or the D2RLoader log and crash report (<game>\d2rloader\logs and \crashes).
      render: text
  - type: input
    id: game
    attributes:
      label: Game version and store
      placeholder: "D2R 3.3, build 93847, Battle.net"
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: D2RLoader version (if used)
      placeholder: "1.3.1"
  - type: input
    id: commit
    attributes:
      label: Toolkit commit
      description: Output of `git rev-parse --short HEAD`.
  - type: input
    id: agent
    attributes:
      label: AI agent and model (if relevant)
      placeholder: "Claude Code, ..."
