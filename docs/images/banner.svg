<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">d2rAI-toolkit</title>
  <desc id="d">Banner: the name d2rAI-toolkit in gold gothic lettering on a dark stone background, with a rune circle emblem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17120f"/>
      <stop offset="1" stop-color="#0a0807"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#c8741a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c8741a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.45" stop-color="#e8b04a"/>
      <stop offset="0.55" stop-color="#b9781f"/>
      <stop offset="1" stop-color="#f0c060"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8913a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8913a"/>
      <stop offset="1" stop-color="#c8913a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="stone" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20h40M20 0v20M0 40h40M40 20v20" stroke="#ffffff" stroke-opacity="0.025" fill="none"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#stone)"/>

  <!-- frame -->
  <rect x="14" y="14" width="1252" height="292" fill="none" stroke="#6b4a1c" stroke-width="2"/>
  <rect x="22" y="22" width="1236" height="276" fill="none" stroke="#3a2a14" stroke-width="1"/>
  <g fill="#c8913a">
    <path d="M14 14l22 0l-22 22z"/><path d="M1266 14l-22 0l22 22z"/>
    <path d="M14 306l22 0l-22 -22z"/><path d="M1266 306l-22 0l22 -22z"/>
  </g>

  <!-- emblem: rune circle with a blade -->
  <g transform="translate(200 160)">
    <circle r="120" fill="url(#glow)"/>
    <circle r="92" fill="none" stroke="#c8913a" stroke-width="2"/>
    <circle r="82" fill="none" stroke="#6b4a1c" stroke-width="1" stroke-dasharray="2 6"/>
    <circle r="62" fill="#120d0a" stroke="#c8913a" stroke-width="1.5"/>
    <g stroke="#e8b04a" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M0 -92v-10M0 92v10M-92 0h-10M92 0h10"/>
      <path d="M65 -65l7 -7M-65 65l-7 7M65 65l7 7M-65 -65l-7 -7"/>
    </g>
    <!-- runic marks on the ring -->
    <g fill="none" stroke="#c8913a" stroke-width="1.6" stroke-linecap="round">
      <path d="M-6 -78l6 -6l6 6M0 -84v12"/>
      <path d="M72 -6l6 6l-6 6M66 0h12"/>
      <path d="M-6 78l6 6l6 -6M0 72v12"/>
      <path d="M-72 -6l-6 6l6 6M-66 0h-12"/>
      <path d="M50 -56l8 2l-2 8"/><path d="M-50 56l-8 -2l2 -8"/>
      <path d="M56 50l-2 8l-8 -2"/><path d="M-56 -50l2 -8l8 2"/>
    </g>
    <!-- blade -->
    <g>
      <path d="M0 -54l7 12v62l-7 10l-7 -10v-62z" fill="url(#gold)" stroke="#5a3a10" stroke-width="1"/>
      <path d="M0 -50v86" stroke="#7a4f14" stroke-width="1"/>
      <path d="M-22 22h44l-6 6h-32z" fill="#c8913a" stroke="#5a3a10" stroke-width="1"/>
      <rect x="-3" y="28" width="6" height="16" fill="#6b4a1c"/>
      <circle cy="48" r="5" fill="#e8b04a" stroke="#5a3a10"/>
    </g>
    <!-- circuit traces: the "AI" -->
    <g stroke="#ffb347" stroke-width="1.4" fill="none" opacity="0.8">
      <path d="M-30 -20h-14v-14"/><circle cx="-44" cy="-36" r="2.5" fill="#ffb347"/>
      <path d="M30 -10h16v16"/><circle cx="46" cy="8" r="2.5" fill="#ffb347"/>
      <path d="M-30 10h-18"/><circle cx="-50" cy="10" r="2.5" fill="#ffb347"/>
      <path d="M30 -32h12"/><circle cx="44" cy="-32" r="2.5" fill="#ffb347"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="Cinzel, 'Trajan Pro', 'Cormorant Garamond', Georgia, 'Times New Roman', serif" text-anchor="start">
    <text x="352" y="168" font-size="92" font-weight="700" letter-spacing="4" fill="#000" opacity="0.6" filter="url(#soft)">d2rAI-toolkit</text>
    <text x="350" y="164" font-size="92" font-weight="700" letter-spacing="4" fill="url(#gold)" stroke="#3a2408" stroke-width="1">d2r<tspan fill="#ffb347">AI</tspan>-toolkit</text>
    <rect x="352" y="190" width="820" height="1.5" fill="url(#rule)"/>
    <text x="354" y="228" font-size="21" letter-spacing="2" textLength="810" lengthAdjust="spacing" fill="#d8c8a8">BUILD AND PORT DIABLO II: RESURRECTED MODS WITH AI AGENTS</text>
    <text x="354" y="262" font-size="17" letter-spacing="2" fill="#8a7a60">prompts in · validated mods, engine plugins and releases out</text>
  </g>
</svg>
